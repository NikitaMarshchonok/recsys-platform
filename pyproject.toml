[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
